<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="100%" height="100%" style="background-color: var(--bg-color, #ffffff); font-family: 'Comic Sans MS', 'Chalkboard SE', 'Virgil', 'Segoe Print', ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <style>
      :root {
        --bg-color: #ffffff;
        --border-color: #1e293b;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --grid-color: #e2e8f0;
        --stories-color: #ff4785;
        --components-color: #0288d1;
        --legend-bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0d1117;
          --border-color: #e6edf3;
          --text-primary: #f0f6fc;
          --text-secondary: #8b949e;
          --grid-color: #21262d;
          --stories-color: #ff6097;
          --components-color: #38bdf8;
          --legend-bg: #161b22;
        }
      }
      
      .axis { stroke: var(--border-color); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .grid { stroke: var(--grid-color); stroke-width: 1.2; stroke-dasharray: 4,4; fill: none; }
      .stories-line { stroke: var(--stories-color); stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .components-line { stroke: var(--components-color); stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .legend-box { stroke: var(--border-color); stroke-width: 1.6; fill: var(--legend-bg); }
      .title-text { fill: var(--text-primary); font-size: 20px; font-weight: bold; text-anchor: middle; }
      .label-text { fill: var(--text-secondary); font-size: 13px; font-weight: 500; }
      .axis-label { fill: var(--text-primary); font-size: 14px; font-weight: 600; text-anchor: middle; }
      .watermark { fill: var(--text-secondary); font-size: 11px; text-anchor: end; opacity: 0.8; }
    </style>
  </defs>

  <!-- Background rect with soft corner -->
  <rect width="850" height="460" rx="10" fill="var(--bg-color)" />

  <!-- Title & Icon -->
  <g id="title-group">
    <text x="425" y="38" class="title-text">✨ Storybook Component &amp; Story Growth</text>
  </g>

  <!-- Grid lines -->
  <g id="grid-group">
    <path d="M NaN NaN" class="grid" />
    <path d="M NaN NaN" class="grid" />
    <path d="M NaN NaN" class="grid" />
    <path d="M NaN NaN" class="grid" />
  </g>

  <!-- Axes -->
  <g id="axes-group">
    <path d="M 75.00 60.43 Q 75.33 73.63 75.30 86.84 Q 75.12 100.05 74.97 113.25 Q 75.27 126.46 75.94 139.66 Q 75.68 152.87 75.12 166.08 Q 75.54 179.28 75.75 192.49 Q 74.98 205.70 74.26 218.90 Q 74.60 232.11 74.43 245.31 Q 74.94 258.52 75.89 271.73 Q 75.51 284.93 75.07 298.14 Q 75.91 311.35 76.17 324.55 Q 74.92 337.76 74.00 350.96 Q 74.10 364.17 74.35 377.38 Q 74.82 390.58 75.00 403.79" class="axis" />
    <path d="M 65.08 395.00 Q 77.71 394.49 90.35 394.18 Q 102.98 394.51 115.62 394.26 Q 128.25 394.98 140.89 395.11 Q 153.52 394.79 166.15 394.84 Q 178.79 394.79 191.42 395.10 Q 204.06 395.24 216.69 395.44 Q 229.33 395.70 241.96 395.59 Q 254.60 395.38 267.23 395.73 Q 279.87 394.86 292.50 394.12 Q 305.14 394.27 317.77 394.40 Q 330.41 394.13 343.04 394.05 Q 355.67 394.95 368.31 395.64 Q 380.94 395.78 393.58 396.00 Q 406.21 396.29 418.85 396.01 Q 431.48 395.51 444.12 394.57 Q 456.75 395.27 469.39 395.58 Q 482.02 395.23 494.66 395.07 Q 507.29 394.85 519.93 394.55 Q 532.56 394.95 545.20 395.37 Q 557.83 395.25 570.46 394.89 Q 583.10 395.08 595.73 394.73 Q 608.37 394.29 621.00 394.10 Q 633.64 394.36 646.27 394.79 Q 658.91 394.86 671.54 395.50 Q 684.18 395.25 696.81 394.95 Q 709.45 394.30 722.08 394.10 Q 734.72 394.67 747.35 395.75 Q 759.98 395.34 772.62 395.23 Q 785.25 395.05 797.89 394.73 Q 810.52 395.16 823.16 395.00" class="axis" />
  </g>

  <!-- Y Tick Labels -->
  <g id="y-labels">
    <text x="63" y="399" class="label-text" text-anchor="end">0</text>
    <text x="63" y="314.7894736842105" class="label-text" text-anchor="end">5</text>
    <text x="63" y="230.57894736842107" class="label-text" text-anchor="end">10</text>
    <text x="63" y="163.21052631578948" class="label-text" text-anchor="end">14</text>
    <text x="63" y="79" class="label-text" text-anchor="end">19</text>
    <text x="27" y="235" class="axis-label" transform="rotate(-90 27 235)">Count</text>
  </g>

  <!-- X Tick Labels -->
  <g id="x-labels">
    
      <path d="M 440.00 394.17 Q 440.36 396.10 440.60 398.03 Q 440.43 399.96 440.00 401.89" class="axis" />
      <text x="440" y="419" class="label-text" text-anchor="middle">2026-09-13</text>
    
    <text x="440" y="446" class="axis-label">Date</text>
  </g>

  <!-- Series Curves -->
  <g id="series-curves">
    <!-- Components Curve -->
    <path d="M 436.00 327.63 A 4 4 0 1 0 444.00 327.63" class="components-line" />
    <path d="M 436.00 327.63 A 4 4 0 1 0 444.00 327.63" class="components-line" opacity="0.6" />

    <!-- Stories Curve -->
    <path d="M 436.00 125.53 A 4 4 0 1 0 444.00 125.53" class="stories-line" />
    <path d="M 436.00 125.53 A 4 4 0 1 0 444.00 125.53" class="stories-line" opacity="0.6" />
  </g>

  <!-- Data Point Markers -->
  <g id="data-points">
    
      <circle cx="440" cy="327.63157894736844" r="4.5" fill="var(--components-color)" stroke="var(--bg-color)" stroke-width="1.5" />
    
    
      <circle cx="440" cy="125.5263157894737" r="4.5" fill="var(--stories-color)" stroke="var(--bg-color)" stroke-width="1.5" />
    
  </g>

  <!-- Legend Box -->
  <g id="legend" transform="translate(0, 0)">
    <rect x="90" y="87" width="220" height="58" rx="4" fill="var(--legend-bg)" />
    <path d="M 88.27 87.00 Q 102.23 86.83 116.18 86.76 Q 130.13 86.72 144.09 86.84 Q 158.04 86.89 171.99 86.73 Q 185.94 86.72 199.90 86.84 Q 213.85 87.12 227.80 87.07 Q 241.75 87.54 255.71 87.74 Q 269.66 87.00 283.61 86.52 Q 297.56 86.98 311.52 87.00 M 310.00 85.37 Q 310.26 100.75 310.68 116.13 Q 310.51 131.51 310.00 146.89 M 311.04 145.00 Q 297.15 145.42 283.26 145.62 Q 269.38 145.45 255.49 145.51 Q 241.60 145.30 227.71 145.15 Q 213.82 144.92 199.93 145.09 Q 186.04 145.24 172.16 145.01 Q 158.27 144.75 144.38 144.54 Q 130.49 144.73 116.60 144.81 Q 102.71 144.91 88.83 145.00 M 90.00 146.51 Q 90.00 131.22 90.31 115.94 Q 89.95 100.65 90.00 85.37" class="legend-box" fill="none" />

    <!-- Stories Legend Item -->
    <rect x="104" y="101" width="14" height="10" rx="2" fill="var(--stories-color)" />
    <text x="126" y="110" class="label-text" font-weight="bold">Stories (16)</text>

    <!-- Components Legend Item -->
    <rect x="104" y="121" width="14" height="10" rx="2" fill="var(--components-color)" />
    <text x="126" y="130" class="label-text" font-weight="bold">Components (4)</text>
  </g>

  <!-- Footer / Watermark -->
  <g id="watermark">
    <text x="830" y="446" class="watermark">storybook-github-pages</text>
  </g>
</svg>