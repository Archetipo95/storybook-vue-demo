name: PR Preview Janitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pages: write
  pull-requests: read

jobs:
  # Pinned to v1.6.1 instead of the latest v1.7.0: same missing
  # `deployments: write` permission issue as pr-preview-cleanup.yml, but
  # in the reusable janitor workflow. Tracked upstream; bump back to @v1
  # once fixed.
  janitor:
    uses: Archetipo95/storybook-github-pages/.github/workflows/pr-preview-janitor.yml@v1.6.1
    with:
      preview_root: pr-preview
      pages_branch: gh-pages
    secrets: inherit
