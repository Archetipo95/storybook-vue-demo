name: PR Preview Janitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pages: write
  deployments: write
  pull-requests: read
  issues: write

jobs:
  janitor:
    name: Prune stale preview directories
    concurrency:
      group: storybook-pages-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages-repo
          fetch-depth: 0

      - name: Prune stale preview directories
        uses: Archetipo95/storybook-github-swiss-knife/actions/preview-janitor@2dd057deb6ffd4a589ec7e3fe3ee7f782eb02f69 # v0.5.0
        with:
          pages_repo: ${{ github.workspace }}/pages-repo
          pages_branch: gh-pages
          preview_root: pr-preview
          # No age-based pruning: PR #22 stays open as the visual regression showcase, and its
          # preview must not expire. Previews of closed PRs are still removed.
          retention_days: '0'
          warning_days_before_cleanup: '0'
