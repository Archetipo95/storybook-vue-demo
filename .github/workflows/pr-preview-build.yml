name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: storybook-pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & package preview (untrusted)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Package and upload preview bundle
        uses: Archetipo95/storybook-github-swiss-knife/actions/preview-build@0be244892b6c2ac5e3bab2a96a309c663ce170df # v0.6.1
        with:
          source_path: 'storybook-static'
          generate_badges: 'true'
          preview_root: 'pr-preview'
          smoke_test: 'true'
