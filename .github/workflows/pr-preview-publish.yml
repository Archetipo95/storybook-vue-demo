name: PR Preview Publish

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [completed]

permissions:
  contents: write
  pages: write
  pull-requests: write
  actions: read
  deployments: write
  issues: write

jobs:
  publish:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-publish.yml@0699ab9fa18ab6de13c926afb7cbc210a0a2a0a5 # v0.2.1
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
