  pages: write
  pull-requests: write
  actions: read
  deployments: write
  issues: write

jobs:
  publish:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-publish.yml@2dd057deb6ffd4a589ec7e3fe3ee7f782eb02f69 # v0.5.0
    secrets: inherit
