name: PR Preview Publish

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [completed]

permissions:
  contents: write
  pages: write
  pull-requests: write
  actions: read
  deployments: write
  issues: write

jobs:
  publish:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-publish.yml@7bf16b2a3afb2ed6053d6be5b0822940bde5d6fe # v0.3.0
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
