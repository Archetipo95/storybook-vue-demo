name: PR Preview Publish

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [completed]

permissions:
  contents: write
  pages: write
  pull-requests: write
  actions: read
  deployments: write
  issues: write

jobs:
  publish:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-publish.yml@498000eb7dd846067ea73623ff07f0b02c9e6a40 # v0.4.0
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
