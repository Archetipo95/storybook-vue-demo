name: PR Preview Publish

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [completed]

permissions:
  contents: write
  pages: write
  pull-requests: write
  actions: read
  deployments: write
  issues: write

jobs:
  publish:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-publish.yml@a09f091428fba8720e5fc5330590b5960414c3c0 # v0.1.1
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
    secrets: inherit
