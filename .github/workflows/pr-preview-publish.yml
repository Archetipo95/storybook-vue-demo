  pages: write
  pull-requests: write
  actions: read
  deployments: write
  issues: write

jobs:
  publish:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-publish.yml@0be244892b6c2ac5e3bab2a96a309c663ce170df # v0.6.1
    secrets: inherit
