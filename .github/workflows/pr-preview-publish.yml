name: PR Preview Publish

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [completed]

permissions:
  contents: write
  pages: write
  pull-requests: write
  actions: read
  issues: write

jobs:
  publish:
    uses: Archetipo95/storybook-github-pages/.github/workflows/pr-preview-publish.yml@cbf1582e05e4995f6fcf2152a77f438232578e6d
    with:
      workflow_run_id: ${{ github.event.workflow_run.id }}
      enable_passcode_gate: true
      passcode_session_hours: 24
    secrets:
      passcode_hash: ${{ secrets.STORYBOOK_PASSCODE_HASH }}
