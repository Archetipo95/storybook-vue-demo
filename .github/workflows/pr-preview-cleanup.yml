name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pages: write
  deployments: write

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@a09f091428fba8720e5fc5330590b5960414c3c0 # v0.1.1
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
