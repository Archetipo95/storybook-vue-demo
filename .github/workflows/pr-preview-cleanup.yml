name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pages: write
  deployments: write
  # swiss-knife 0.4.0: the cleanup marks the PR's preview comment as removed.
  pull-requests: write

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@dd56dacab3dc7138851951cf3479a5c17ddc5076 # v0.7.0
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
