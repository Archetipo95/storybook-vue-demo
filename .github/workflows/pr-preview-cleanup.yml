name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pages: write
  deployments: write

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@0699ab9fa18ab6de13c926afb7cbc210a0a2a0a5 # v0.2.1
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
