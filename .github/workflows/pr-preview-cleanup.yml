name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pages: write
  deployments: write
  # swiss-knife 0.4.0: the cleanup marks the PR's preview comment as removed.
  pull-requests: write

jobs:
  cleanup:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/pr-preview-cleanup.yml@498000eb7dd846067ea73623ff07f0b02c9e6a40 # v0.4.0
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
