name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    name: Build and Deploy Storybook
    # Shares the Pages-branch group with the PR preview publish, cleanup and
    # janitor runs; queue: max makes writers wait instead of cancelling each other.
    concurrency:
      group: storybook-pages-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://archetipo95.github.io/storybook-vue-demo/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Checkout Pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages-repo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Storybook to GitHub Pages
        uses: Archetipo95/storybook-github-swiss-knife/actions/publisher@a09f091428fba8720e5fc5330590b5960414c3c0 # v0.1.1
        with:
          pages_repo: ${{ github.workspace }}/pages-repo
          pages_branch: gh-pages
          source_directory: ${{ github.workspace }}/storybook-static
          managed_directories: pr-preview
          site_url: https://archetipo95.github.io/storybook-vue-demo/
