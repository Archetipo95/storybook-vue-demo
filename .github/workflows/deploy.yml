name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: storybook-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Storybook
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://archetipo95.github.io/storybook-vue-demo/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-repo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Storybook to GitHub Pages
        uses: Archetipo95/storybook-github-pages/publisher@v1.9.1
        with:
          pages_repo: ${{ github.workspace }}/pages-repo
          pages_branch: gh-pages
          source_directory: ${{ github.workspace }}/storybook-static
          managed_directories: pr-preview
          site_url: https://archetipo95.github.io/storybook-vue-demo/
