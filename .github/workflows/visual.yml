name: Visual

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: ['main']

# Label events get their own group, so a label never cancels a comparison.
concurrency:
  group: >-
    visual-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  visual:
    uses: Archetipo95/storybook-github-swiss-knife/.github/workflows/visual.yml@239a07b3dbd31f0b4e59f89fa92e96898e7b6ecf # v0.1.0
    permissions:
      contents: read
      actions: read
